
workflows:
  foodwise-ios-test:
    name: FoodWise iOS Test
    instance_type: mac_mini_m2
    max_build_duration: 60

    working_directory: foodwise_modern_ui/mobile

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Generate iOS folder
        script: |
          flutter create --platforms=ios .

      - name: Install dependencies
        script: |
          flutter pub get

      - name: Build iOS
        script: |
          flutter build ios --debug --no-codesign --dart-define=API_BASE_URL=https://foodwise-1-bksq.onrender.com

    artifacts:
      - foodwise_modern_ui/mobile/build/ios/iphoneos/*.app
